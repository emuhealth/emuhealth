name: Client contracts

# Fidelity gate: drives the emulators with the client libraries real integrations use (rwslib, fhirclient,
# dicomweb-client with pydicom, python-hl7, and Veeva's VAPIL). Third-party clients run here, not on developer machines.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/@emuhealth/fhir-core/**"
      - "packages/@emuhealth/dicomweb/**"
      - "packages/@emuhealth/hl7v2/**"
      - "packages/@emuhealth/rave/**"
      - "packages/@emuhealth/veeva/**"
      - "packages/emuhealth/src/**"
      - "tests/clients/**"
      - ".github/workflows/clients.yml"
  # Weekly: the latest release of every client instead of the pinned versions.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      latest:
        description: Use the latest client versions instead of the pinned ones
        type: boolean
        default: false

env:
  LATEST: ${{ github.event_name == 'schedule' || inputs.latest == true }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: rwslib, fhirclient, dicomweb-client, python-hl7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=emuhealth...

      - name: Start emuhealth
        run: |
          node packages/emuhealth/dist/index.js start --service fhir,dicomweb,hl7v2,rave > emuhealth.log 2>&1 &
          for url in http://localhost:4100/metadata http://localhost:4124/studies http://localhost:4125/mllp \
            http://localhost:4127/RaveWebServices/version; do
            for i in $(seq 1 30); do curl -sf "$url" > /dev/null && break; sleep 1; done
            curl -sf "$url" > /dev/null || { cat emuhealth.log; exit 1; }
          done

      - name: Install the clients
        run: |
          if [ "$LATEST" = "true" ]; then
            sed -E 's/==.*//' tests/clients/requirements.txt > requirements-latest.txt
            pip install -U -r requirements-latest.txt
          else
            pip install -r tests/clients/requirements.txt
          fi
          pip list 2>/dev/null | grep -iE "rwslib|fhirclient|dicomweb|hl7|pydicom"

      - run: pytest tests/clients -v

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clients-python
          path: emuhealth.log

  vapil:
    name: Veeva VAPIL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=emuhealth...

      # VAPIL builds https URLs only, so a throwaway certificate and nginx put TLS in front of the emulator, and the
      # emulator advertises the https address.
      - name: Start emuhealth behind TLS
        run: |
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
            -keyout certs/localhost.key -out certs/localhost.crt
          keytool -importcert -noprompt -alias localhost -file certs/localhost.crt -keystore certs/trust.p12 \
            -storetype PKCS12 -storepass changeit
          node packages/emuhealth/dist/index.js start --service veeva --base-url https://localhost:8443 > emuhealth.log 2>&1 &
          docker run -d --name tls --network host -v "$PWD/certs:/certs:ro" \
            -v "$PWD/tests/clients/veeva-vapil/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine
          for i in $(seq 1 30); do curl -sf --cacert certs/localhost.crt https://localhost:8443/api > /dev/null && exit 0; sleep 1; done
          cat emuhealth.log
          docker logs tls
          exit 1

      - name: Run VAPIL
        working-directory: tests/clients/veeva-vapil
        run: |
          if [ "$LATEST" = "true" ]; then
            version=$(curl -fsSL https://veeva.github.io/vault-api-library/maven/com/veeva/vault/vapil/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
            mvn -B -q versions:set-property -Dproperty=vapil.version -DnewVersion="$version"
          fi
          mvn -B -q compile dependency:build-classpath -Dmdep.outputFile=cp.txt
          java -Djavax.net.ssl.trustStore=../../../certs/trust.p12 -Djavax.net.ssl.trustStorePassword=changeit \
            -cp "target/classes:$(cat cp.txt)" dev.emuhealth.contract.VapilContract localhost:8443

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clients-vapil
          path: emuhealth.log
