      apiKey: synthetic-key
  # Your webhook and signing secret for auth, deauth, and data events
  webhook:
    url: http://localhost:3000/terra/webhook
    secret: synthetic-signing-secret

dicomweb:
  # Synthetic CT and MR studies; false starts empty
  generate:
    studies: 3
    instancesPerSeries: 3
  # DICOM Part 10 files to load (Explicit or Implicit VR Little Endian)
  # files:
  #   - ./fixtures/synthetic-ct.dcm
  # Require Authorization: Bearer <token>
  # token: synthetic-token

hl7v2:
  # MLLP listener; false turns it off
  mllp:
    port: 2575
  # Reject message types the emulator does not apply (AR, ERR code 200) instead of accepting them
  # strict: true
  # Extra synthetic patients for the registry
  # patients:
  #   - mrn: syn-mrn-100
  #     family: SYNTHETIC
  #     given: QUINN

veeva:
  # Vault users for POST /api/{version}/auth
  users:
    - username: admin@synthetic-vault.example
      password: synthetic-password
  # Extra object records
  # records:
  #   product__v:
  #     - name__v: Examplor
  #       generic_name__c: examplorumab

rave:
  # RWS users for HTTP Basic auth
  users:
    - username: rws.synthetic
      password: synthetic-password
  # Subjects per Prod environment; false starts without subjects
  generate:
    subjects: 8

# Synthetic health plan: patient access (CARIN Blue Button), payer-to-payer (PDex), Plan-Net directory
payer:
  generate:
    patients: 5
    seed: 1
  directory: true # false leaves the Plan-Net directory empty
  smart:
    clients:
      - client_id: member-app
        redirect_uris: ["http://localhost:3000/callback"]
      - client_id: synthetic-new-payer
        client_secret: synthetic-new-payer-secret

# Da Vinci prior authorization: CRD at /cds-services, DTR and PAS at /fhir
priorauth: {}

# IHE XDS.b registry and repository and XCA responding gateway over SOAP
xds:
  generate:
    patients: 5
    seed: 1
  # More patient ids (CX) to accept in submissions
  # patientIds: ["SYN-900001^^^&2.25.211144934573491648823315826212385512893&ISO"]
