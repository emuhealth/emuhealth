# FHIR R4 server (health service, default port 4100). Synthetic data only.
# One synthetic population for every patient-centric service (FHIR, EHRs, payers, devices, HL7 v2, Rave)
# population:
#   patients: 25
#   seed: 42
#   scenarios: [diabetes-cgm, inpatient-stay, trial-adverse-event]

fhir:
  # Failure testing; any service takes the same key. PUT /_emulate/faults changes it at runtime.
  # faults:
  #   latency: { ms: 200 }
  #   rateLimit: { requests: 100, windowSeconds: 60 }
  #   outage: { status: 503, probability: 0.1 }
  #   expiredTokens: { probability: 0.05 }
  # Record exchanges as NDJSON; replay with 'npx emuhealth replay <file> --service fhir'
  # record:
  #   path: ./recordings/fhir.ndjson
  # FHIR version: 4.0.1 (R4, default), 4.3.0 (R4B), or 5.0.0 (R5)
  fhirVersion: R4
  # SMART App Launch clients; with none, any client_id and redirect_uri is accepted
  smart:
    clients:
      - client_id: my-smart-app
        redirect_uris: ["http://localhost:3000/callback"]
  # Generated synthetic population (default 5 patients); false starts empty
  generate:
    patients: 5
    seed: 1
  # Files or directories to load: Synthea output, Bundles, single resources, or Bulk Data .ndjson
  # import:
  #   - ./synthea/output/fhir
  resources:
    - resourceType: Patient
      id: synthetic-patient-1
      name:
        - family: Example
          given: [Jamie]
      gender: female
      birthDate: "1980-01-01"
    - resourceType: Observation
      status: final
      code:
        text: Heart rate
      subject:
        reference: Patient/synthetic-patient-1
      valueQuantity:
        value: 72
        unit: beats/minute

epic:
  # Same keys as fhir (generate, resources, smart, terminology), served under /api/FHIR/R4
  smart:
    clients:
      - client_id: my-epic-app
        redirect_uris: ["http://localhost:3000/callback"]
  # Slots for Appointment/$find and $book: weekdays from startDate (default today), 09:00 to 16:00 UTC
  scheduling:
    startDate: "2026-11-02"
    days: 10

openfda:
  # Synthetic labels, adverse event reports, and recalls; false starts empty
  generate:
    seed: 1
    events: 300 # adverse event reports, 0 to 5000
  # Extra synthetic records per endpoint
  records:
    drug/label:
      - id: my-label-1
        openfda:
          generic_name: ["EXAMPLEMAB"]

rxnav:
  # RxNorm concepts to add; clinical drugs list their ingredient rxcuis
  concepts:
    - rxcui: "900001"
      name: examplemab
      tty: IN
    - rxcui: "900002"
      name: examplemab 10 MG Injection
      tty: SCD
      ingredients: ["900001"]
  # defaults: false starts without the built-in RxNorm subset

clinicaltrials:
  # Synthetic studies (NCT99 ids); false starts empty
  generate:
    studies: 60 # 0 to 2000
    seed: 1
  # Your own synthetic studies in the API v2 shape
  studies:
    - protocolSection:
        identificationModule:
          nctId: NCT99999999
          briefTitle: My synthetic study
        statusModule:
          overallStatus: RECRUITING

ncbi:
  # Synthetic PubMed articles (PMIDs from 99000001); false starts without them
  generate:
    articles: 80 # 0 to 5000
    seed: 1

nppes:
  # Synthetic providers (NPIs start with 0); false starts empty
  generate:
    individuals: 40
    organizations: 15
    seed: 1
  # Your own synthetic providers in the API's result shape
  providers:
    - number: "0999999990"
      enumeration_type: NPI-1
      basic:
        first_name: JAMIE
        last_name: EXAMPLE
        credential: M.D.

benchling:
  # Synthetic tenant: sequences, entries, schemas, registry, assay results
  generate:
    seed: 1
    dnaSequences: 10 # 0 to 500
  # Webhooks signed like Benchling (Svix): webhook-id, webhook-timestamp, webhook-signature
  webhooks:
    - url: http://localhost:3000/benchling/webhook
      events: [v2.entry.created, v2.entity.registered]
      secret: whsec_c3ludGhldGljLXNlY3JldA==

redcap:
  # API tokens (32 hex characters); default 5E7E0000000000000000000000000001
  tokens: ["5E7E0000000000000000000000000001"]
  # Synthetic records; false keeps the data dictionary only
  generate:
    records: 20 # 0 to 5000
    seed: 1
  # Your own records in flat format
  records:
    - record_id: "100"
      sex: "1"
      sbp: "128"

cerner:
  # Same keys as fhir, served under /r4/5e7e0000-0000-4000-8000-000000000001
  smart:
    clients:
      - client_id: my-millennium-app
        redirect_uris: ["http://localhost:3000/callback"]
      # A system account: client_credentials with Basic auth
      - client_id: my-system-account
        client_secret: synthetic-secret
        scope: system/Patient.read system/Observation.read

athena:
  # Practice ids the API accepts (195900 is athenahealth's preview practice)
  practiceIds: ["195900"]
  # Same keys as fhir for the shared synthetic records
  generate:
    patients: 5
  # Open appointment slots on weekdays from startDate (default today)
  scheduling:
    days: 10

bluebutton:
  # Synthetic beneficiaries with Coverage and ExplanationOfBenefit claims
  generate:
    patients: 5
    seed: 1
  smart:
    clients:
      - client_id: my-blue-button-app
        redirect_uris: ["http://localhost:3000/callback"]

cdshooks:
  # Your CDS services' discovery URLs, offered in the inspector
  services:
    - http://localhost:3000/cds-services
  # Same keys as fhir for the EHR's synthetic records (generate, resources)

redox:
  # API keys and secrets; with none, any pair authenticates
  sources:
    - apiKey: synthetic-api-key
      secret: synthetic-secret
  # Your destination endpoints, sent EHR events with the verification-token header
  destinations:
    - url: http://localhost:3000/redox
      verificationToken: synthetic-verification-token
      dataModels: [PatientAdmin, Results, Scheduling]

healthlake:
  region: us-east-1
  accountId: "123456789012"
  # Key pairs that verify; default: AWS's documented example pair
  credentials:
    - accessKeyId: AKIAIOSFODNN7EXAMPLE
      secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  # Datastores at startup; preload loads the synthetic population
  datastores:
    - name: synthetic
      preload: true

gcphealthcare:
  # Datasets and FHIR stores at startup (replaces the default)
  datasets:
    - project: synthetic-project
      location: us-central1
      id: synthetic-dataset
      fhirStores:
        - id: synthetic-fhir-store
          enableUpdateCreate: true
          preload: true

azurehealth:
  # Workspaces and FHIR services (replaces the default synthetic-fhir)
  workspaces:
    - name: synthetic
      fhirServices:
        - name: fhir
          preload: true
  # Verify Entra ID tokens issued by the microsoft service (omit to accept any Bearer token)
  entra:
    issuer: http://localhost:4005/9188040d-6c67-4c5b-b112-36a304b66dad/v2.0

stedi:
  # API keys; with none, any key is accepted
  apiKeys: [test_synthetic_key]
  # Members from the synthetic patient generator
  generate:
    patients: 5
    seed: 1
  # Event destinations for transaction.processed.v2 (835 ready)
  webhooks:
    - url: http://localhost:3000/stedi/events

availity:
  # Members and claim history from the synthetic patient generator
  generate:
    patients: 5
  # Polls that answer In Progress (statusCode 0) before Complete (4)
  pollsUntilComplete: 1

dexcom:
  # Registered apps; with none, any client id and redirect URI is accepted
  clients:
    - client_id: my-dexcom-app
      client_secret: synthetic-secret
      redirect_uris: ["http://localhost:3000/callback"]
  # Users from the synthetic patient generator
  generate:
    patients: 5

