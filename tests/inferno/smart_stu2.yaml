# Inferno execution script: SMART App Launch STU2 standalone launch, EHR launch, and backend services against
# emuhealth at http://localhost:4100. The browser steps are played by browser.mjs.
sessions:
  - suite: smart_stu2

steps:
  - state_description: Session created
    status: created
    start_run:
      runnable: 1
      inputs:
        url: http://localhost:4100
        standalone_smart_auth_info:
          auth_type: public
          client_id: inferno-public
          requested_scopes: launch/patient openid fhirUser offline_access patient/*.rs
          pkce_support: enabled
          pkce_code_challenge_method: S256
          auth_request_method: GET
          use_discovery: "true"
        ehr_smart_auth_info:
          auth_type: public
          client_id: inferno-public
          requested_scopes: launch openid fhirUser offline_access user/*.rs
          pkce_support: enabled
          pkce_code_challenge_method: S256
          auth_request_method: GET
          use_discovery: "true"
        backend_services_smart_auth_info:
          auth_type: backend_services
          client_id: inferno-backend
          requested_scopes: system/*.rs
          encryption_algorithm: ES384
          use_discovery: "true"
    action_description: Run group 1, standalone launch

  - state_description: Waiting for the standalone authorization redirect
    status: waiting
    last_completed: 1.2.02
    command: node ../tests/inferno/browser.mjs authorize '{wait_outputs.authorization_url}'
    action_description: Sign in as a practitioner and pick a patient

  - state_description: Finished group 1
    status: done
    last_completed: 1
    start_run:
      runnable: 2
    action_description: Run group 2, EHR launch

  - state_description: Waiting for the EHR to launch Inferno
    status: waiting
    last_completed: 2.2.01
    command: node ../tests/inferno/browser.mjs launch '{wait_outputs.launch_uri}' '{wait_outputs.target_iss}'
    action_description: Launch Inferno from the EHR launch simulator

  - state_description: Waiting for the EHR launch authorization redirect
    status: waiting
    last_completed: 2.2.04
    command: node ../tests/inferno/browser.mjs authorize '{wait_outputs.authorization_url}'
    action_description: Authorize the launched app

  - state_description: Finished group 2
    status: done
    last_completed: 2
    start_run:
      runnable: 3
    action_description: Run group 3, backend services

  - state_description: Finished group 3
    status: done
    last_completed: 3
    action: END_SCRIPT
    action_description: Done
